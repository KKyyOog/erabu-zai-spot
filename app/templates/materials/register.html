{% extends "base.html" %}

{% block content %}
<section class="card post-form-card offer-form-card">
  <p class="entry-badge offer">材があります</p>
  <h2>余っている材を知らせる</h2>
  <p class="hint">寸法を測ったり本数を数えたりしなくても投稿できます。</p>

  <p id="user-registration-check-status" class="hint">マイページの登録状況を確認しています...</p>
  <div id="user-registration-required" class="flash" role="alert" tabindex="-1" hidden>
    <p>投稿するには、先にマイページでユーザー情報を登録してください。</p>
    <p><a class="button-link" href="{{ url_for('users.me') }}">マイページで登録する</a></p>
  </div>

  <form method="post" action="{{ url_for('materials.submit') }}" enctype="multipart/form-data" data-requires-user-registration hidden>
    <input type="hidden" name="line_user_id" id="line_user_id">
    <input type="hidden" name="display_name" id="display_name">

    <label>写真を撮る・ライブラリから選ぶ *</label>
    <input type="file" name="image_files" accept="image/*" multiple required data-max-files="6">
    <p class="hint">現状が分かる写真を1〜6枚選んでください。</p>

    <label>材の種類 *</label>
    <select name="material_type" required>
      <option value="">選択してください</option>
      {% for material_type in material_type_options %}
        <option value="{{ material_type }}">{{ material_type }}</option>
      {% endfor %}
    </select>

    <label>量の目安 *</label>
    <select name="quantity_level" required>
      <option value="">選択してください</option>
      {% for quantity_level in quantity_level_options %}
        <option value="{{ quantity_level }}">{{ quantity_level }}</option>
      {% endfor %}
    </select>

    <label>受け渡しエリア *</label>
    <select name="location" id="location" required>
      <option value="">選択してください</option>
      {% for area in area_options %}
        <option value="{{ area }}">{{ area }}</option>
      {% endfor %}
    </select>

    <details class="optional-fields">
      <summary>詳しい情報を追加する（任意）</summary>
      <div class="optional-fields__body">
        <label>寸法</label>
        <input type="text" name="size" placeholder="例：約2m、1〜3m程度、不明">

        <label>数量</label>
        <input type="text" name="quantity" placeholder="例：5本ほど、軽トラック1台分">

        <label>状態</label>
        <select name="condition">
          <option value="">選択してください</option>
          <option value="比較的きれい">比較的きれい</option>
          <option value="使用感あり">使用感あり</option>
          <option value="傷・汚れあり">傷・汚れあり</option>
          <option value="現物確認推奨">現物確認推奨</option>
          <option value="不明">不明</option>
        </select>

        <label>コメント</label>
        <textarea name="description" rows="4" placeholder="材の特徴、受け渡し方法、使えそうな用途など"></textarea>

        <label>受け渡し希望期限</label>
        <input type="date" name="pickup_deadline">
      </div>
    </details>

    <button type="submit">この内容で投稿する</button>
    <p class="hint">投稿は30日後に通常一覧から自動的に非表示になります。</p>
  </form>
</section>

<script>
  window.FILL_DISPLAY_NAME_FROM_LIFF = true;
  window.REQUIRE_LIFF_LOGIN = true;
  window.REQUIRE_USER_REGISTRATION = true;
  window.LIFF_ID = {{ LIFF_ID|tojson }};

  document.querySelectorAll('[data-max-files]').forEach((input) => {
    input.addEventListener('change', () => {
      const maxFiles = Number(input.dataset.maxFiles || 6);
      if (input.files.length > maxFiles) {
        window.alert(`画像は${maxFiles}枚まで選択できます。`);
        input.value = '';
      }
    });
  });
</script>
<script src="{{ url_for('static', filename='js/liff.js', v='20260907-line-identity') }}"></script>
{% endblock %}
