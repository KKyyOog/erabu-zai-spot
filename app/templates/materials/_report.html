<details class="post-report">
  <summary>この投稿を運営に報告する</summary>
  <form method="post" action="{{ url_for('materials.report_post', kind=report_kind, entry_id=report_id) }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="line_user_id">
    <label>報告する理由<select name="reason" required><option value="">選択してください</option>{% for reason in ['個人情報が公開されている', '内容が不適切', '掲載内容に問題がある'] %}<option>{{ reason }}</option>{% endfor %}</select></label>
    <button type="submit" class="secondary-button">運営へ報告する</button>
  </form>
</details>
