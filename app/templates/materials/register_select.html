{% extends "base.html" %}

{% block content %}
<section class="card post-type-select">
  <h2>投稿する内容を選ぶ</h2>
  <p class="page-intro">あなたの目的に合うものを押してください。</p>

  <div class="choice-grid post-type-choice-grid">
    <a class="choice-card offer-choice" href="{{ url_for('materials.register_material') }}">
      <span class="choice-kicker">余っている材がある方</span>
      <span class="choice-title">材を譲りたい</span>
      <span class="choice-text">写真、材の種類、量の目安、受け渡しエリアだけで投稿できます。</span>
    </a>

    <a class="choice-card request-choice" href="{{ url_for('materials.register_request') }}">
      <span class="choice-kicker">欲しい材が見つからない方</span>
      <span class="choice-title">探している材を知らせたい</span>
      <span class="choice-text">探している材の種類と内容を投稿し、島内からの情報を待ちます。</span>
    </a>
  </div>

  <div class="secondary-registration-link">
    <p>これから解体する建物の情報を共有する場合</p>
    <a class="button-link compact secondary-button" href="{{ url_for('materials.register_demolition') }}">解体予定物件を登録する</a>
  </div>
</section>
{% endblock %}
